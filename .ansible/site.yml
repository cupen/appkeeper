---
# appkeeper 本机部署入口（免 inventory，connection=local）。
#
# 用法：
#   cd .ansible
#   ansible-playbook site.yml \
#     -e appkeeper_binary_src=../target/release/appkeeper \
#     -e appkeeper_config_src=../examples/daemon.toml
#
# 将来扩展远程多主机：编写 inventory 后去掉本 play 的 `connection: local`，
# 用 `ansible-playbook -i <inventory> site.yml` 执行，role 无需改动。
- name: Deploy appkeeper
  hosts: localhost
  connection: local
  become: true
  any_errors_fatal: true
  roles:
    - appkeeper
