---
# 只读预检：对目标机做任何变更之前执行。
#   - 命中既有安装痕迹且未强制覆盖 → fail fast（目标机零变更）
#   - 命中且为本 role 部署的相同内容（checksum 一致 + 服务 running/enabled）
#     → 幂等命中，置 ak_idempotent_hit 由入口 end_host 跳过
# systemctl 探测均 failed_when: false + changed_when: false，只读取输出。

- name: Detect existing systemd unit file
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ appkeeper_service_name }}.service"
  register: ak_unit_pre

- name: Detect service active state
  ansible.builtin.command: "systemctl is-active {{ appkeeper_service_name }}"
  register: ak_active_pre
  failed_when: false
  changed_when: false
  # 只读命令，check 模式下也真实执行，保证护栏在 dry-run 中可用
  check_mode: false

- name: Detect service enabled state
  ansible.builtin.command: "systemctl is-enabled {{ appkeeper_service_name }}"
  register: ak_enabled_pre
  failed_when: false
  changed_when: false
  check_mode: false

- name: Detect existing binary (with checksum)
  ansible.builtin.stat:
    path: "{{ appkeeper_binary_dest }}"
    get_checksum: true
  register: ak_binary_pre

- name: Detect existing daemon config (with checksum)
  ansible.builtin.stat:
    path: "{{ appkeeper_config_dest }}"
    get_checksum: true
  register: ak_config_pre

- name: Collect detected traces of an existing installation
  ansible.builtin.set_fact:
    ak_traces: >-
      {{ []
         + (['systemd unit file exists: /etc/systemd/system/' ~ appkeeper_service_name ~ '.service'] if ak_unit_pre.stat.exists else [])
         + (['service is ' ~ ak_active_pre.stdout] if ak_active_pre.rc == 0 else [])
         + (['service is enabled'] if ak_enabled_pre.rc == 0 else [])
         + (['binary exists at ' ~ appkeeper_binary_dest] if ak_binary_pre.stat.exists else [])
         + (['daemon config exists at ' ~ appkeeper_config_dest] if ak_config_pre.stat.exists else []) }}

- name: Determine idempotent hit (own deployment, identical content)
  ansible.builtin.set_fact:
    ak_idempotent_hit: >-
      {{ ak_unit_pre.stat.exists
         and ak_active_pre.rc == 0
         and ak_enabled_pre.rc == 0
         and ak_binary_pre.stat.exists
         and ak_config_pre.stat.exists
         and ak_binary_pre.stat.checksum | default('') == ak_src_binary.stat.checksum
         and ak_config_pre.stat.checksum | default('') == ak_src_config.stat.checksum }}

- name: Report idempotent hit (no changes will be made)
  ansible.builtin.debug:
    msg: >-
      检测到本机已由相同内容部署（二进制与配置 checksum 一致，服务运行中且已开机自启），
      幂等跳过，服务不会重启。
  when: ak_idempotent_hit | bool

- name: Fail fast on existing installation without force override
  ansible.builtin.fail:
    msg: >-
      检测到目标机已存在 appkeeper 安装，为避免误触生产环境，本次执行已停止，
      目标机未做任何修改。检测到的痕迹：{{ ak_traces | join('; ') }}。
      如确认要覆盖并重启既有安装，请在 extra-vars 中显式设置
      appkeeper_force_overwrite: true 后重试。
  when:
    - ak_traces | length > 0
    - not ak_idempotent_hit | bool
    - not appkeeper_force_overwrite | bool

- name: Report force-overwrite path
  ansible.builtin.debug:
    msg: >-
      appkeeper_force_overwrite=true：检测到既有安装（{{ ak_traces | join('; ') }}），
      将覆盖二进制与配置并按需重启服务。
  when:
    - ak_traces | length > 0
    - appkeeper_force_overwrite | bool
