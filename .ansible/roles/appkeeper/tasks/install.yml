---
# 护栏通过后的安装流程：目录 → 分发二进制 → 装 daemon 配置 → service install
# → 验证。文件变化经 handler 触发服务重启（仅覆盖既有安装时生效）。

- name: Ensure destination directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ appkeeper_binary_dest }}"
    - "{{ appkeeper_config_dest }}"

- name: Distribute appkeeper binary
  ansible.builtin.copy:
    src: "{{ xk_binary_effective_src }}"
    dest: "{{ appkeeper_binary_dest }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart ak service

- name: Install daemon config
  ansible.builtin.copy:
    src: "{{ appkeeper_config_src }}"
    dest: "{{ appkeeper_config_dest }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ak service

- name: Build service install argument list
  ansible.builtin.set_fact:
    xk_service_install_argv: >-
      {{ [appkeeper_binary_dest, 'service', 'install', '--now', '--name', appkeeper_service_name]
         + (['--force'] if (appkeeper_force_overwrite | bool and xk_traces | length > 0) else [])
         + (['--user', appkeeper_service_user] if appkeeper_service_user | length > 0 else []) }}

- name: Register and start ak service
  ansible.builtin.command:
    argv: "{{ xk_service_install_argv }}"
  changed_when: not xk_unit_pre.stat.exists

- name: Verify service is running
  ansible.builtin.command: "systemctl is-active {{ appkeeper_service_name }}"
  register: xk_active_post
  changed_when: false
  failed_when: xk_active_post.rc != 0
  # check 模式不会真正注册服务，无从验证
  when: not ansible_check_mode
