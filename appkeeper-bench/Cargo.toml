[package]
name = "appkeeper-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Load benchmark harness for a real appkeeper daemon: case-driven load generation, external metric collection and machine-readable reports"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# connect 模式从 /v1/status 的 config_source 读回 daemon.toml 解析 app_dir/log_dir
toml = "1.1"
# 退出路径（含 ctrl-C）统一清理
ctrlc = "3.4"
# 轮转归档是 gzip（`.N.gz`）：对账时解压后校验序号连续性
flate2 = "1"
