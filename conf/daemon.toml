# appkeeper daemon 配置模板（daemon.toml）—— 全局唯一：守护进程自身设置 + 所有 app 的公共默认值。
#
# 默认查找位置：Linux /etc/appkeeper/daemon.toml，Windows
# %ProgramData%\appkeeper\daemon.toml（旧 %APPDATA%\appkeeper\daemon.toml 在
# 新路径缺失时自动回退兼容）；
# 可用 --config 覆盖：ak --config conf/daemon.toml run
# 文件可以不存在 —— 缺失时按本文件注释中的内置默认值运行。
#
# 校验本文件：ak --config conf/daemon.toml validate

[daemon]
# 守护进程自身日志级别：trace | debug | info | warn | error
log_level = "info"

# 子进程 stdout/stderr 的落盘目录，必须是绝对路径。
# 注意 /tmp 重启即清空；需要跨重启保留日志请改成如 /var/log/appkeeper。
# Windows 下默认 %TEMP%\appkeeper\logs。
# 这里只放日志：持久状态（unless-stopped 的用户停止记录）在下面的 state_dir，
# 本目录可随时清理/轮转，不影响状态。
log_dir = "/tmp/appkeeper/logs"

# 持久状态目录（State 类）：unless-stopped 的「用户停止」记录落在这里，必须
# 跨重启保留。与 log_dir 相互独立——改动或清理 log_dir 不影响记录；必须绝对
# 路径。未配置时按顺序推导：环境变量 STATE_DIRECTORY（服务形态由 unit 的
# StateDirectory= 注入，即 /var/lib/appkeeper/<uid>）→ 平台 State 缺省
# （unix：root 为 /var/lib/appkeeper/<uid>，非 root 为
# $XDG_STATE_HOME/appkeeper 或 ~/.local/state/appkeeper；Windows：服务形态
# %ProgramData%\appkeeper\state，控制台 %LOCALAPPDATA%\appkeeper\state）。
# 在 systemd 之外长期运行、又拿不到 StateDirectory 注入时建议显式配置。
# state_dir = "/srv/appkeeper/state"

# 服务形态说明（ak daemon install 注册的 systemd unit / Windows 服务）：
# 守护进程不继承登录 shell 的环境——unit 内固定确定性 PATH，受管程序依赖
# HOME 等变量时需在 app 配置的 env 里显式声明；停机走 systemctl stop / sc stop
# （此形态下 ak daemon shutdown 会被拒绝）。

# 守护循环巡检周期（秒），取值范围 (0, 60]
monitor_interval = 1.0

# 控制端点（URL，形态由 scheme 决定）：status/start/stop/log 等 CLI 与
# appkeeper-bench 都走它。缺省形态是本地 IPC：unix 上按 uid 分层
# （/run/appkeeper/<uid>/ak.sock），root 与普通用户可各跑一个守护进程互不冲突；
# Windows 下是 \\.\pipe\ak-<用户名>.sock。socket 上跑 HTTP/1.1。
# 写成 tcp://host:port 则改为监听 TCP 控制端点（同机直连或远程管理均可，
# 见 auth_token 注释）。
#
# 谁能连上由端点形态唯一决定：
# - 本地 IPC 形态：由操作系统决定——unix 上 socket 权限 0600、所在 uid 目录
#   0700，内核在 connect() 阶段就拒绝非属主；Windows 上是命名管道的 DACL。
#   此形态没有应用层凭据（下面的 auth_token 必须保持注释）。
# - TCP 形态：凭 Bearer token 准入（auth_token 必配），除 /v1/health 外全部
#   /v1/* 要求凭据。注意是明文 HTTP：只应部署在受信网络或 SSH 隧道内。
socket = "/run/appkeeper/1000/ak.sock"

# 控制端点凭据——仅 socket = "tcp://host:port" 形态生效：
# tcp:// 形态必配（非空），路径形态下设置会被校验拒绝（保持注释即可）。
# auth_token = "change-me"

# 每个输出流在内存中保留的最近行数，`ak log` 与 webui 实时日志的数据源。
log_buffer_lines = 1000

# app 注册目录：每个已注册 app 一个 <name>.toml 链接文件。
# 相对路径相对于本配置文件所在目录。缺省名 app.d（生产默认 /etc/appkeeper/app.d）。
# 升级提示：旧版本缺省为 apps；已装机实例若依赖它，请显式写回 app_dir = "apps"
# 或迁移既有注册文件。
app_dir = "app.d"

# ---------------------------------------------------------------------------
# 所有 app 的公共默认值（整个表可省略）。
# 优先级：[program.*] 显式字段 > app 文件的 [app] 表 > 这里的 [app-default]。
# 字段名与程序级字段一致（restart/exit_codes/restart_backoff/... 全集见
# conf/app.toml 注释），下面只列最常用的：
[app-default]
restart = "always"         # 启动/重启策略：no | on-failure | always | unless-stopped
restart_backoff = 1.0      # 首次重启延迟（秒），指数退避到 max_restart_backoff
# max_restart_backoff = 30.0
# max_restarts = 0         # 0 = 不限次数
