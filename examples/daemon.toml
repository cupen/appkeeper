# appkeeper daemon config sample (daemon.toml) — global settings only.
# Default locations: Linux /etc/appkeeper/daemon.toml, Windows %APPDATA%\appkeeper\daemon.toml
# Override with: ak --config <path> run
# The file may be absent entirely; appkeeper then runs empty with these defaults.

[daemon]
log_level = "info"          # trace|debug|info|warn|error
log_dir = "/tmp/appkeeper/logs" # absolute path required; /tmp is volatile — use e.g. /var/log/appkeeper for logs that survive reboots
monitor_interval = 1.0      # supervision tick (seconds)
host = "127.0.0.1"          # control API bind address (loopback by default)
port = 7310                 # control API port
auth_token = ""             # empty = no auth (loopback only); set a secret to require Bearer auth
log_buffer_lines = 1000     # in-memory ring per stream, used by `ak log --tail/-f`
app_dir = "app.d"           # registration directory: one <name>.toml link per registered app (default app.d; old default was apps)

# Optional: defaults for every registered app (fields mirror program fields).
# Program-explicit fields and the app's own [app] table override these.
[app-default]
restart = "always"          # no | on-failure | always | unless-stopped
restart_backoff = 1.0       # restart delay (seconds), doubles up to max_restart_backoff
